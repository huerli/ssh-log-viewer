name: CI and Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', 'V*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release for the selected tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.x'
  PNPM_VERSION: '11.25.0'

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Build renderer
        run: pnpm build

  package:
    name: Package ${{ matrix.target }} ${{ matrix.arch }}
    needs: validate
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            arch: x64
            runner: ubuntu-24.04
            command: pnpm exec electron-builder --linux deb --publish never
          - target: windows
            arch: x64
            runner: windows-2025
            command: pnpm exec electron-builder --win nsis --publish never
          - target: macos
            arch: arm64
            runner: macos-14
            command: pnpm exec electron-builder --mac dmg --publish never
          - target: macos
            arch: x64
            runner: macos-15-intel
            command: pnpm exec electron-builder --mac dmg --publish never
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify package version
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            expected="${GITHUB_REF_NAME#v}"
            expected="${expected#V}"
          fi
          actual="$(node -p "require('./package.json').version")"
          test "$actual" = "$expected"
          echo "VERSION=$expected" >> "$GITHUB_ENV"
      - name: Build renderer for package
        run: pnpm build
      - name: Verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'process.arch')" = "${{ matrix.arch }}"
      - name: Package installer
        shell: bash
        run: ${{ matrix.command }} --${{ matrix.arch }}
      - name: Verify macOS executable architecture
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          executable="$(find release -path '*/Contents/MacOS/SSH Log Viewer' -type f -print -quit)"
          expected="${{ matrix.arch }}"
          if [[ "$expected" == x64 ]]; then expected=x86_64; fi
          test "$(lipo -archs "$executable")" = "$expected"
      - name: Collect installer, checksum, and update metadata
        shell: bash
        run: node scripts/collect-release.cjs "${{ matrix.target }}" "$VERSION" --arch "${{ matrix.arch }}"
      - name: Validate package update metadata
        shell: bash
        run: node scripts/validate-updates.cjs artifacts "$VERSION" --target "${{ matrix.target }}" --arch "${{ matrix.arch }}"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ssh-log-viewer-${{ matrix.target }}-${{ matrix.arch }}-${{ github.ref_name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub release
    needs: package
    if: >-
      startsWith(github.ref, 'refs/tags/') &&
      (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'V')) &&
      (github.event_name != 'workflow_dispatch' || inputs.publish == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tag
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify tag and package version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version="${version#V}"
          test "$version" = "$(node -p "require('./package.json').version")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Download installers
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: ssh-log-viewer-*-${{ github.ref_name }}
          path: release-assets
          merge-multiple: true
      - name: Validate installers, checksums, and update metadata
        run: node scripts/validate-updates.cjs release-assets "$VERSION"
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          else
            if [[ -f "docs/releases/$TAG.md" ]]; then
              gh release create "$TAG" --draft --title "SSH Log Viewer $TAG" --notes-file "docs/releases/$TAG.md"
            else
              gh release create "$TAG" --draft --title "SSH Log Viewer $TAG" --notes "Cross-platform release $TAG."
            fi
          fi
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" release-assets/* --clobber
      - name: Upload verified release to update server
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/create-server-release.cjs release-assets "$TAG"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/update_upload
          chmod 600 ~/.ssh/update_upload
          cat scripts/update-server-known-hosts >> ~/.ssh/known_hosts
          trap 'rm -f ~/.ssh/update_upload' EXIT
          remote="/srv/ssh-log-viewer/releases/$TAG"
          ssh -i ~/.ssh/update_upload -o BatchMode=yes -o StrictHostKeyChecking=yes root@64.81.112.231 "mkdir -p '$remote'"
          rsync -av --exclude latest.json -e 'ssh -i ~/.ssh/update_upload -o BatchMode=yes -o StrictHostKeyChecking=yes' release-assets/ "root@64.81.112.231:$remote/"
          ssh -i ~/.ssh/update_upload -o BatchMode=yes -o StrictHostKeyChecking=yes root@64.81.112.231 "cd '$remote' && sha256sum -c -- *.sha256"
          scp -i ~/.ssh/update_upload -o BatchMode=yes -o StrictHostKeyChecking=yes release-assets/latest.json "root@64.81.112.231:$remote/latest.json"
          ssh -i ~/.ssh/update_upload -o BatchMode=yes -o StrictHostKeyChecking=yes root@64.81.112.231 "python3 - '$TAG'" < scripts/activate-server-release.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
