name: CI and Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', 'V*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release for the selected tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.x'
  PNPM_VERSION: '11.25.0'

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Build renderer
        run: pnpm build

  package:
    name: Package ${{ matrix.target }}
    needs: validate
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-24.04
            command: pnpm exec electron-builder --linux deb --publish never
          - target: windows
            runner: windows-2025
            command: pnpm exec electron-builder --win nsis --publish never
          - target: macos
            runner: macos-14
            command: pnpm exec electron-builder --mac dmg --publish never
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify package version
        shell: bash
        run: |
          set -euo pipefail
          expected="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            expected="${GITHUB_REF_NAME#v}"
            expected="${expected#V}"
          fi
          actual="$(node -p "require('./package.json').version")"
          test "$actual" = "$expected"
          echo "VERSION=$expected" >> "$GITHUB_ENV"
      - name: Build renderer for package
        run: pnpm build
      - name: Determine package architecture
        shell: bash
        run: echo "PACKAGE_ARCH=$(node -p 'process.arch')" >> "$GITHUB_ENV"
      - name: Package installer
        shell: bash
        run: ${{ matrix.command }} --"$PACKAGE_ARCH"
      - name: Collect installer, checksum, and update metadata
        shell: bash
        run: node scripts/collect-release.cjs "${{ matrix.target }}" "$VERSION" --arch "$PACKAGE_ARCH"
      - name: Validate package update metadata
        shell: bash
        run: node scripts/validate-updates.cjs artifacts "$VERSION" --target "${{ matrix.target }}" --arch "$PACKAGE_ARCH"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ssh-log-viewer-${{ matrix.target }}-${{ github.ref_name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub release
    needs: package
    if: >-
      startsWith(github.ref, 'refs/tags/') &&
      (startsWith(github.ref_name, 'v') || startsWith(github.ref_name, 'V')) &&
      (github.event_name != 'workflow_dispatch' || inputs.publish == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out tag
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Verify tag and package version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version="${version#V}"
          test "$version" = "$(node -p "require('./package.json').version")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Download installers
        uses: actions/download-artifact@v4.3.0
        with:
          pattern: ssh-log-viewer-*-${{ github.ref_name }}
          path: release-assets
          merge-multiple: true
      - name: Validate installers, checksums, and update metadata
        run: node scripts/validate-updates.cjs release-assets "$VERSION"
      - name: Create or reuse draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          else
            if [[ -f "docs/releases/$TAG.md" ]]; then
              gh release create "$TAG" --draft --title "SSH Log Viewer $TAG" --notes-file "docs/releases/$TAG.md"
            else
              gh release create "$TAG" --draft --title "SSH Log Viewer $TAG" --notes "Cross-platform release $TAG."
            fi
          fi
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" release-assets/* --clobber
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
